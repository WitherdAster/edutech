[phases.setup]
aptPackages = ["libxcb1", "libxcb-util1", "libxcb-shm0", "libxcb-render0", "libxcb-randr0", "libxcb-xfixes0", "libxcb-shape0", "libxcb-xinerama0", "libxcb-xkb1", "libxcb-xtest0"]

[phases.install]
cmds = [
    "python3 -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip",
    ". /opt/venv/bin/activate && pip install -r requirements.txt",
    ". /opt/venv/bin/activate && pip uninstall -y opencv-python",
    "printf '\\nPATH=/opt/venv/bin:$PATH' >> /root/.profile"
]
